<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Platita - Ingresar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="login-body">
  <div class="app-container login-container">
    
    <!-- Encabezado Estilo Boceto -->
    <div class="login-header-section">
      <div class="login-icon-circle">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <h1 class="login-main-title">¡Hola soy<br><span class="highlight-platita">Platita!</span></h1>
    </div>

    <!-- Tarjeta Inferior Desplegable -->
    <div class="login-bottom-card">
      <div class="login-card-titles">
        <h2 id="form-title">Iniciar sesión</h2>
        <p id="form-subtitle">Ingresá con tu DNI y contraseña</p>
      </div>

      <form id="auth-form" class="login-form-elements">
        <div class="input-group">
          <label>DNI</label>
          <input type="text" id="auth-doc" placeholder="Ej: 12345678" required>
        </div>
        
        <div class="input-group">
          <label>Contraseña</label>
          <input type="password" id="auth-pass" placeholder="Tu contraseña" required>
        </div>
        
        <button type="submit" id="btn-submit" class="btn-login-action">Iniciar sesión</button>
      </form>

      <div class="login-switch-footer">
        <span id="toggle-text">¿No tenés cuenta?</span> 
        <button type="button" id="btn-toggle" class="btn-text-link">Registrate</button>
      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dhmnbvwntcqmgwvbohdt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRobW5idndudGNxbWd3dmJvaGR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTAxMjEsImV4cCI6MjEwODI2NjEyMX0.rho1v1cyZYlUJFXmewHL8Xhp1MxG6KqepWeHxXaJ9Pw';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let isLogin = true;
    const form = document.getElementById('auth-form');
    const btnSubmit = document.getElementById('btn-submit');
    const btnToggle = document.getElementById('btn-toggle');
    const formTitle = document.getElementById('form-title');
    const formSubtitle = document.getElementById('form-subtitle');
    const toggleText = document.getElementById('toggle-text');

    // Si ya hay sesión activa, redirigir al panel
    supabaseClient.auth.getUser().then(({ data }) => {
      if (data.user) window.location.href = 'app.html';
    });

    btnToggle.addEventListener('click', () => {
      isLogin = !isLogin;
      formTitle.innerText = isLogin ? 'Iniciar sesión' : 'Crear cuenta';
      formSubtitle.innerText = isLogin ? 'Ingresá con tu DNI y contraseña' : 'Registrate con tu DNI y una clave';
      btnSubmit.innerText = isLogin ? 'Iniciar sesión' : 'Registrarse';
      toggleText.innerText = isLogin ? '¿No tenés cuenta?' : '¿Ya tenés cuenta?';
      btnToggle.innerText = isLogin ? 'Registrate' : 'Ingresá';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const doc = document.getElementById('auth-doc').value.trim();
      const password = document.getElementById('auth-pass').value.trim();
      const email = `${doc}@platita.app`;

      if (isLogin) {
        const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
        if (error) alert('Error al ingresar: Verificá tus datos.');
        else window.location.href = 'app.html';
      } else {
        const { error } = await supabaseClient.auth.signUp({ email, password });
        if (error) alert('Error al registrarse: ' + error.message);
        else {
          alert('¡Cuenta creada con éxito! Ya podés iniciar sesión.');
          isLogin = true;
          formTitle.innerText = 'Iniciar sesión';
          formSubtitle.innerText = 'Ingresá con tu DNI y contraseña';
          btnSubmit.innerText = 'Iniciar sesión';
          toggleText.innerText = '¿No tenés cuenta?';
          btnToggle.innerText = 'Registrate';
          form.reset();
        }
      }
    });
  </script>
</body>
</html>
