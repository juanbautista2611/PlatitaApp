<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Platita - Gestión y Carga</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de carga / Transición -->
  <div id="transition-overlay" class="page-transition-overlay">
    <div class="loader-spinner"></div>
    <span class="loader-text">Cargando Platita...</span>
  </div>

  <div class="app-container">
    <main class="main-content">
      <!-- Header Superior -->
      <header class="top-header">
        <div class="header-top-row">
          <h1 class="logo-title">Gestión y Carga</h1>
          <div class="header-right">
            <a href="#" onclick="cambiarPagina('app.html'); return false;" style="background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; padding: 0.3rem 0.6rem; border-radius: 0.5rem; font-size: 0.75rem; font-weight: 600; text-decoration: none;">⬅️ Volver al Panel</a>
          </div>
        </div>
        <div class="welcome-block">
          <span class="greeting-sub">Administración de tu mes</span>
          <h2 style="font-size: 1.2rem;">Cargá y organizá tus finanzas</h2>
        </div>
      </header>

      <!-- Registrar Operación (Cuadro de dinero grande) -->
      <section class="card form-container-card" style="margin-bottom: 1.25rem;">
        <h3 style="font-size: 0.85rem; margin-bottom: 0.75rem; color: #fff; text-transform: uppercase;">📝 Registrar Operación</h3>
        <form id="transaction-form" class="futuristic-form">
          <div class="form-row" style="margin-bottom: 0.6rem;">
            <select id="tx-type" style="width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem;">
              <option value="expense">Gasto</option>
              <option value="income">Ingreso</option>
            </select>
          </div>
          <div class="form-row" style="margin-bottom: 0.6rem;">
            <select id="tx-category" required style="width: 100%; background: rgba(15, 23, 42, 0.8); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem;">
              <option value="">Seleccioná categoría...</option>
            </select>
          </div>
          <div class="form-row" style="margin-bottom: 0.6rem;">
            <input type="text" inputmode="numeric" id="tx-amount" placeholder="$ 50.000" required oninput="formatearInputMoneda(this)" style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #38bdf8; font-weight: 700; padding: 0.75rem; border-radius: 0.4rem; font-size: 1.1rem; text-align: center;">
          </div>
          <div class="form-row" style="margin-bottom: 0.75rem;">
            <input type="date" id="tx-date" required style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem;">
          </div>
          <button type="submit" class="btn-futuristic" style="width: 100%; padding: 0.75rem; font-size: 0.85rem; font-weight: 700;">Registrar Movimiento</button>
        </form>

        <div style="margin-top: 1rem; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 0.75rem;">
          <form id="category-form" style="display: flex; gap: 0.4rem;">
            <input type="text" id="new-cat-name" placeholder="Nueva categoría (Ej: Super)" required style="flex: 1; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.5rem; border-radius: 0.4rem; font-size: 0.8rem;">
            <button type="submit" class="btn-sub" style="padding: 0.5rem 0.8rem; font-size: 0.75rem;">+ Crear</button>
          </form>
        </div>
      </section>

      <!-- Compromisos Fijos -->
      <section class="card section-box" style="margin-bottom: 1.25rem;">
        <div class="section-title-row">
          <h3 style="font-size: 0.85rem; color: #fff; text-transform: uppercase;">📌 Compromisos Fijos</h3>
        </div>
        <form id="fixed-form" class="mini-fixed-form" style="margin-top: 0.5rem;">
          <input type="text" id="fx-name" placeholder="Nombre (Ej: Gimnasio)" required style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem; margin-bottom: 0.5rem;">
          <input type="text" inputmode="numeric" id="fx-amount" placeholder="$ 50.000" required oninput="formatearInputMoneda(this)" style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #38bdf8; font-weight: 700; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.95rem; margin-bottom: 0.5rem;">
          <button type="submit" class="btn-sub" style="width: 100%; padding: 0.6rem; font-size: 0.8rem;">Añadir Gasto Fijo</button>
        </form>
        <ul id="fixed-list" class="futuristic-list" style="margin-top: 0.75rem;">
          <li>Cargando compromisos...</li>
        </ul>
      </section>

      <!-- Meta de Ahorro -->
      <section class="card section-box" style="margin-bottom: 2rem;">
        <div class="section-title-row">
          <h3 style="font-size: 0.85rem; color: #fff; text-transform: uppercase;">💰 Meta de Ahorro</h3>
        </div>
        <form id="goal-form" class="mini-fixed-form" style="margin-top: 0.5rem; margin-bottom: 0.75rem;">
          <input type="text" id="goal-title" placeholder="Proyecto (Ej: Viaje)" required style="width: 100%; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem; margin-bottom: 0.5rem;">
          <div style="display:flex; gap:0.4rem; margin-bottom: 0.5rem;">
            <input type="text" inputmode="numeric" id="goal-target" placeholder="Meta ($)" required oninput="formatearInputMoneda(this)" style="flex: 1; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem;">
            <input type="text" inputmode="numeric" id="goal-current" placeholder="Actual ($)" required oninput="formatearInputMoneda(this)" style="flex: 1; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem;">
          </div>
          <button type="submit" class="btn-sub" style="width: 100%; padding: 0.6rem; font-size: 0.8rem;">Definir / Reiniciar Meta</button>
        </form>

        <form id="aportar-ahorro-form" style="display: flex; gap: 0.4rem; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 0.75rem;">
          <input type="text" inputmode="numeric" id="aporte-amount" placeholder="Ahorro este mes ($)" required oninput="formatearInputMoneda(this)" style="flex: 1; background: rgba(15, 23, 42, 0.6); border: 1px solid #334155; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-size: 0.85rem;">
          <button type="submit" class="btn-sub" style="background: #34d399; color: #05070b; padding: 0.6rem 0.8rem; font-size: 0.8rem; font-weight: 700;">+ Ahorrar</button>
        </form>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="gestion.js"></script>
  <script>
    function cambiarPagina(urlDestino) {
      const overlay = document.getElementById('transition-overlay');
      if (overlay) overlay.classList.add('active');
      setTimeout(() => { window.location.href = urlDestino; }, 2000);
    }
    window.addEventListener('pageshow', () => {
      const overlay = document.getElementById('transition-overlay');
      if (overlay) overlay.classList.remove('active');
    });
  </script>
</body>
</html>
