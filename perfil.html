<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Platita - Mi Perfil y Vencimientos</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Chart.js para el gráfico de tortas -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google API Script -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>

  <!-- Pantalla de carga / Transición -->
  <div id="transition-overlay" class="page-transition-overlay">
    <div class="loader-spinner"></div>
    <span class="loader-text">Cargando Platita...</span>
  </div>

  <div class="app-container">
    <main class="main-content">
      <!-- Header Superior -->
      <header class="top-header">
        <div class="header-top-row">
          <h1 class="logo-title">Mi Perfil</h1>
          <div class="header-right">
            <a href="#" onclick="cambiarPagina('app.html'); return false;" style="background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; padding: 0.3rem 0.6rem; border-radius: 0.5rem; font-size: 0.7rem; font-weight: 600; text-decoration: none;">Volver</a>
          </div>
        </div>
        <div class="welcome-block">
          <span class="greeting-sub">Cuenta vinculada</span>
          <h2 id="user-dni-display" style="font-size: 1.3rem;">Cargando usuario...</h2>
        </div>
      </header>

      <!-- Información de la Cuenta y Google Tasks -->
      <section class="card" style="margin-bottom: 1.25rem;">
        <h3 style="font-size: 0.8rem; font-weight: 700; color: #ffffff; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;">Notificaciones al Celular</h3>
        <p style="font-size: 0.7rem; color: #94a3b8; margin-bottom: 0.75rem;">Conectá tu Google para recibir alertas el día anterior a tus vencimientos.</p>
        <button id="btn-google-auth" class="btn-sub" style="background: #3b82f6; color: #fff; width: 100%;">Conectar con Google Tasks</button>
        <span id="google-status" style="font-size: 0.7rem; color: #34d399; display: block; margin-top: 0.5rem; text-align: center;"></span>
      </section>

      <!-- Calendario de Vencimientos -->
      <section class="card section-box" style="margin-bottom: 1.25rem;">
        <div class="section-title-row">
          <h3>📅 Vencimientos a Pagar</h3>
        </div>
        <form id="calendar-form" class="mini-fixed-form" style="margin-bottom: 1rem;">
          <input type="text" id="cal-title" placeholder="Concepto (Ej: Alquiler)" required>
          <div style="display: flex; gap: 0.4rem;">
            <input type="number" id="cal-amount" placeholder="Monto ($)" required>
            <input type="date" id="cal-date" required>
          </div>
          <button type="submit" class="btn-sub" style="margin-top: 0.4rem;">Añadir Vencimiento</button>
        </form>
        <ul id="calendar-list" class="futuristic-movements">
          <li>Cargando vencimientos...</li>
        </ul>
      </section>

      <!-- Gráfico de Estadísticas -->
      <section class="card" style="margin-bottom: 2rem;">
        <h3 style="font-size: 0.8rem; font-weight: 700; color: #ffffff; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;">Distribución de Gastos</h3>
        <div style="position: relative; width: 100%; max-width: 260px; margin: 0 auto 1rem auto;">
          <canvas id="expensesPieChart"></canvas>
        </div>
        <div id="chart-legend-custom" style="font-size: 0.72rem; color: #cbd5e1; display: flex; flex-direction: column; gap: 0.3rem;"></div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://dhmnbvwntcqmgwvbohdt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRobW5idndudGNxbWd3dmJvaGR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2OTAxMjEsImV4cCI6MjEwODI2NjEyMX0.rho1v1cyZYlUJFXmewHL8Xhp1MxG6KqepWeHxXaJ9Pw';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // CONFIGURÁ ACÁ TU CLIENT ID DE GOOGLE CLOUD
    const CLIENT_ID = '480210187183-f4e9dnrehith8tnq0lu0d98d1mk4m649.apps.googleusercontent.com';
    const SCOPES = 'https://www.googleapis.com/auth/tasks';
    let tokenClient;
    let accessToken = localStorage.getItem('google_access_token');

    let myChart = null;

    function cambiarPagina(urlDestino) {
      const overlay = document.getElementById('transition-overlay');
      if (overlay) overlay.classList.add('active');
      setTimeout(() => { window.location.href = urlDestino; }, 2000);
    }

    window.addEventListener('pageshow', () => {
      const overlay = document.getElementById('transition-overlay');
      if (overlay) overlay.classList.remove('active');
    });

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) {
        cambiarPagina('index.html');
        return;
      }

      const dni = user.email ? user.email.split('@')[0] : 'Desconocido';
      document.getElementById('user-dni-display').innerText = `DNI: ${dni}`;

      if (accessToken) {
        document.getElementById('google-status').innerText = '✔ Google Tasks conectado';
        document.getElementById('btn-google-auth').innerText = 'Cambiar cuenta de Google';
      }

      // Inicializar Google Identity Services
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (response) => {
          if (response.error) {
            alert('Error al conectar con Google');
            return;
          }
          accessToken = response.access_token;
          localStorage.setItem('google_access_token', accessToken);
          document.getElementById('google-status').innerText = '✔ Google Tasks conectado';
          document.getElementById('btn-google-auth').innerText = 'Cambiar cuenta de Google';
          alert('¡Cuenta de Google vinculada con éxito para notificaciones!');
        }
      });

      document.getElementById('btn-google-auth').addEventListener('click', () => {
        tokenClient.requestAccessToken({ prompt: 'consent' });
      });

      const calDateInput = document.getElementById('cal-date');
      if (calDateInput) calDateInput.value = new Date().toISOString().split('T')[0];

      cargarCalendario();
      cargarEstadisticasGastos();

      const calendarForm = document.getElementById('calendar-form');
      if (calendarForm) {
        calendarForm.addEventListener('submit', async (e) => {
          e.preventDefault();
          const title = document.getElementById('cal-title').value.trim();
          const amount = parseFloat(document.getElementById('cal-amount').value);
          const due_date = document.getElementById('cal-date').value;

          // Guardar en Supabase
          const { error } = await supabaseClient
            .from('calendar_events')
            .insert([{ title, amount: Math.round(amount), due_date, status: 'pending' }]);

          if (error) {
            alert('Error al guardar: ' + error.message);
            return;
          }

          // Crear tarea en Google Tasks para el DÍA ANTERIOR
          if (accessToken) {
            crearTareaGoogleTask(title, amount, due_date);
          } else {
            alert('Vencimiento guardado. Conectá tu cuenta de Google arriba si querés que te llegue la alerta al celu.');
          }

          calendarForm.reset();
          if (calDateInput) calDateInput.value = new Date().toISOString().split('T')[0];
          cargarCalendario();
        });
      }
    });

    // Función para calcular el día anterior y enviarlo a Google Tasks
    async function crearTareaGoogleTask(title, amount, dueDateStr) {
      // Calcular fecha del día anterior
      const fechaVenc = new Date(dueDateStr + 'T00:00:00');
      fechaVenc.setDate(fechaVenc.getDate() - 1); // Restar 1 día
      const isoDatePrevious = fechaVenc.toISOString(); // Formato que exige la API de Google

      const tareaData = {
        title: `⚠️ Recordatorio: Pagar ${title} ($${amount})`,
        notes: `Vence mañana (${dueDateStr}). ¡No te olvides de abonarlo desde Platita!`,
        due: isoDatePrevious
      };

      try {
        const response = await fetch('https://tasks.googleapis.com/tasks/v1/lists/@default/tasks', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${accessToken}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(tareaData)
        });

        if (response.ok) {
          console.log('Recordatorio agendado en Google Tasks para el día anterior.');
        } else {
          console.error('Error al sincronizar con Google Tasks');
        }
      } catch (err) {
        console.error('Error de red al crear tarea:', err);
      }
    }

    async function cargarCalendario() {
      const { data: events } = await supabaseClient.from('calendar_events').select('*').order('due_date', { ascending: true });
      const listContainer = document.getElementById('calendar-list');
      if (!listContainer) return;

      listContainer.innerHTML = '';
      if (!events || events.length === 0) {
        listContainer.innerHTML = '<li style="padding: 0.5rem; color: #64748b; text-align:center;">No hay vencimientos agendados.</li>';
        return;
      }

      events.forEach(ev => {
        const li = document.createElement('li');
        li.className = 'fixed-item-row';
        li.innerHTML = `
          <div class="fixed-info">
            <strong>${ev.title}</strong>
            <span style="font-size: 0.7rem; color: #94a3b8;">Vence: ${ev.due_date}</span>
            <span class="${ev.status === 'paid' ? 'expense-amount-green' : 'expense-amount-red'}">$ ${ev.amount}</span>
          </div>
          <div class="fixed-actions">
            <button class="${ev.status === 'pending' ? 'badge-pending' : 'badge-paid'}" onclick="toggleCalendarEvent(${ev.id}, '${ev.status}')">
              ${ev.status === 'pending' ? 'Pagar' : 'Pagado'}
            </button>
            <button class="btn-delete-fixed" onclick="deleteCalendarEvent(${ev.id})">🗑️</button>
          </div>
        `;
        listContainer.appendChild(li);
      });
    }

    window.toggleCalendarEvent = async function(id, currentStatus) {
      const newStatus = currentStatus === 'pending' ? 'paid' : 'pending';
      await supabaseClient.from('calendar_events').update({ status: newStatus }).eq('id', id);
      cargarCalendario();
      cargarEstadisticasGastos();
    };

    window.deleteCalendarEvent = async function(id) {
      if (confirm('¿Eliminar este vencimiento?')) {
        await supabaseClient.from('calendar_events').delete().eq('id', id);
        cargarCalendario();
        cargarEstadisticasGastos();
      }
    };

    async function cargarEstadisticasGastos() {
      const { data: transactions } = await supabaseClient.from('transactions').select('*');
      const { data: fixedExpenses } = await supabaseClient.from('fixed_expenses').select('*');
      const { data: calendarEvents } = await supabaseClient.from('calendar_events').select('*');

      const categorias = {};
      if (transactions) {
        transactions.filter(tx => tx.type === 'expense').forEach(tx => {
          categorias[tx.category.trim()] = (categorias[tx.category.trim()] || 0) + Number(tx.amount);
        });
      }
      if (fixedExpenses) {
        fixedExpenses.filter(fx => fx.status === 'paid').forEach(fx => {
          categorias[`Fijo: ${fx.name.trim()}`] = (categorias[`Fijo: ${fx.name.trim()}`] || 0) + Number(fx.amount);
        });
      }
      if (calendarEvents) {
        calendarEvents.filter(ev => ev.status === 'paid').forEach(ev => {
          categorias[`Vencimiento: ${ev.title.trim()}`] = (categorias[`Vencimiento: ${ev.title.trim()}`] || 0) + Number(ev.amount);
        });
      }

      const labels = Object.keys(categorias);
      const dataValues = Object.values(categorias);
      renderizarGraficoTorta(labels, dataValues);
    }

    function renderizarGraficoTorta(labels, dataValues) {
      const canvasElement = document.getElementById('expensesPieChart');
      if (!canvasElement) return;
      const ctx = canvasElement.getContext('2d');
      const legendContainer = document.getElementById('chart-legend-custom');

      if (labels.length === 0) {
        legendContainer.innerHTML = '<span style="text-align:center; color:#64748b; display:block; padding: 1rem;">No hay gastos registrados.</span>';
        if (myChart) myChart.destroy();
        return;
      }

      legendContainer.innerHTML = '';
      const backgroundColors = labels.map(label => {
        if (label.startsWith('Fijo:') || label.startsWith('Vencimiento:')) return '#f87171';
        const palette = ['#3b82f6', '#34d399', '#c084fc', '#fbbf24', '#38bdf8', '#fb7185'];
        return palette[Math.floor(Math.random() * palette.length)];
      });

      if (myChart) myChart.destroy();
      myChart = new Chart(ctx, {
        type: 'doughnut',
        data: { labels, datasets: [{ data: dataValues, backgroundColor: backgroundColors, borderWidth: 0 }] },
        options: { responsive: true, plugins: { legend: { position: 'bottom', labels: { color: '#94a3b8', font: { size: 11 }, boxWidth: 12 } } } }
      });
    }
  </script>
</body>
</html>
