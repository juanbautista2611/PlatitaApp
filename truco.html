<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Platita - Anotador de Truco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Pantalla de carga / Transición -->
  <div id="transition-overlay" class="page-transition-overlay">
    <div class="loader-spinner"></div>
    <span class="loader-text">Cargando Truco...</span>
  </div>

  <div class="app-container">
    <main class="main-content">
      <!-- Header Superior -->
      <header class="top-header">
        <div class="header-top-row">
          <h1 class="logo-title">🃏 Anotador de Truco</h1>
          <div class="header-right">
<a href="#" onclick="cambiarPagina('calculadora.html'); return false;" style="background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3); color: #60a5fa; padding: 0.3rem 0.6rem; border-radius: 0.5rem; font-size: 0.7rem; font-weight: 600; text-decoration: none;">Volver</a>          </div>
        </div>
        <div class="welcome-block">
          <span class="greeting-sub">Chismes, mentiras y envido</span>
          <h2 style="font-size: 1.2rem;">Partida a 30 Tantos</h2>
        </div>
      </header>

      <!-- Botón de Reiniciar Partida -->
      <section style="margin-bottom: 1rem; text-align: right;">
        <button onclick="reiniciarTruco()" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 0.3rem 0.6rem; border-radius: 0.4rem; font-size: 0.68rem; font-weight: 600; cursor: pointer;">🔄 Nueva Partida</button>
      </section>

      <!-- Tablero de Anotación -->
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 2rem;">
        
        <!-- EQUIPO 1 -->
        <div class="card" style="padding: 1rem; text-align: center; display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <input type="text" id="eq1-nombre" value="Nosotros" onchange="guardarTruco()" style="background: transparent; border: none; border-bottom: 1px dashed #334155; color: #38bdf8; font-size: 0.9rem; font-weight: 700; text-align: center; width: 100%; margin-bottom: 0.5rem; padding-bottom: 0.2rem;">
            <div style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.2rem;" id="eq1-fase">Fase: Malas</div>
            <div id="eq1-puntos" style="font-size: 3rem; font-weight: 900; color: #fff; line-height: 1; margin: 0.5rem 0;">0</div>
          </div>

          <!-- Botones de Sumar / Restar Equipo 1 -->
          <div style="display: flex; flex-direction: column; gap: 0.4rem; margin-top: 1rem;">
            <div style="display: flex; gap: 0.3rem;">
              <button onclick="modificarPuntos('eq1', 1)" style="flex: 2; background: #3b82f6; border: none; color: #fff; padding: 0.6rem; border-radius: 0.4rem; font-weight: 700; font-size: 0.9rem; cursor: pointer;">+1</button>
              <button onclick="modificarPuntos('eq1', 3)" style="flex: 1; background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; color: #60a5fa; padding: 0.6rem; border-radius: 0.4rem; font-weight: 700; font-size: 0.8rem; cursor: pointer;">+3</button>
            </div>
            <button onclick="modificarPuntos('eq1', -1)" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; padding: 0.3rem; border-radius: 0.4rem; font-size: 0.7rem; cursor: pointer;">-1 (Restar)</button>
          </div>
        </div>

        <!-- EQUIPO 2 -->
        <div class="card" style="padding: 1rem; text-align: center; display: flex; flex-direction: column; justify-content: space-between;">
          <div>
            <input type="text" id="eq2-nombre" value="Ellos" onchange="guardarTruco()" style="background: transparent; border: none; border-bottom: 1px dashed #334155; color: #34d399; font-size: 0.9rem; font-weight: 700; text-align: center; width: 100%; margin-bottom: 0.5rem; padding-bottom: 0.2rem;">
            <div style="font-size: 0.65rem; color: #94a3b8; text-transform: uppercase; margin-bottom: 0.2rem;" id="eq2-fase">Fase: Malas</div>
            <div id="eq2-puntos" style="font-size: 3rem; font-weight: 900; color: #fff; line-height: 1; margin: 0.5rem 0;">0</div>
          </div>

          <!-- Botones de Sumar / Restar Equipo 2 -->
          <div style="display: flex; flex-direction: column; gap: 0.4rem; margin-top: 1rem;">
            <div style="display: flex; gap: 0.3rem;">
              <button onclick="modificarPuntos('eq2', 1)" style="flex: 2; background: #10b981; border: none; color: #05070b; padding: 0.6rem; border-radius: 0.4rem; font-weight: 700; font-size: 0.9rem; cursor: pointer;">+1</button>
              <button onclick="modificarPuntos('eq2', 3)" style="flex: 1; background: rgba(16, 185, 129, 0.2); border: 1px solid #10b981; color: #34d399; padding: 0.6rem; border-radius: 0.4rem; font-weight: 700; font-size: 0.8rem; cursor: pointer;">+3</button>
            </div>
            <button onclick="modificarPuntos('eq2', -1)" style="background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; padding: 0.3rem; border-radius: 0.4rem; font-size: 0.7rem; cursor: pointer;">-1 (Restar)</button>
          </div>
        </div>

      </div>

    </main>
  </div>

  <script>
    let partida = JSON.parse(localStorage.getItem('platita_truco_partida')) || {
      eq1Nombre: 'Nosotros',
      eq1Puntos: 0,
      eq2Nombre: 'Ellos',
      eq2Puntos: 0
    };

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('eq1-nombre').value = partida.eq1Nombre;
      document.getElementById('eq2-nombre').value = partida.eq2Nombre;
      actualizarPantallaTruco();
    });

    function cambiarPagina(urlDestino) {
      const overlay = document.getElementById('transition-overlay');
      if (overlay) overlay.classList.add('active');
      setTimeout(() => { window.location.href = urlDestino; }, 2000);
    }

    window.addEventListener('pageshow', () => {
      const overlay = document.getElementById('transition-overlay');
      if (overlay) overlay.classList.remove('active');
    });

    function modificarPuntos(equipo, cantidad) {
      if (equipo === 'eq1') {
        partida.eq1Puntos = Math.max(0, Math.min(30, partida.eq1Puntos + cantidad));
        if (partida.eq1Puntos === 30) {
          setTimeout(() => alert(`¡ ${partida.eq1Nombre} ganaron la partida de truco! 🍷🎉`), 100);
        }
      } else {
        partida.eq2Puntos = Math.max(0, Math.min(30, partida.eq2Puntos + cantidad));
        if (partida.eq2Puntos === 30) {
          setTimeout(() => alert(`¡ ${partida.eq2Nombre} ganaron la partida de truco! 🍷🎉`), 100);
        }
      }
      guardarTruco();
    }

    function guardarTruco() {
      partida.eq1Nombre = document.getElementById('eq1-nombre').value.trim() || 'Nosotros';
      partida.eq2Nombre = document.getElementById('eq2-nombre').value.trim() || 'Ellos';
      localStorage.setItem('platita_truco_partida', JSON.stringify(partida));
      actualizarPantallaTruco();
    }

    function reiniciarTruco() {
      if (confirm('¿Arrancar una nueva partida de cero?')) {
        partida.eq1Puntos = 0;
        partida.eq2Puntos = 0;
        guardarTruco();
      }
    }

    function actualizarPantallaTruco() {
      document.getElementById('eq1-puntos').innerText = partida.eq1Puntos;
      document.getElementById('eq2-puntos').innerText = partida.eq2Puntos;

      // Detectar si están en malas (0-15) o buenas (16-30)
      const fase1 = partida.eq1Puntos > 15 ? 'Fase: Buenas ✨' : 'Fase: Malas 🛑';
      const fase2 = partida.eq2Puntos > 15 ? 'Fase: Buenas ✨' : 'Fase: Malas 🛑';

      document.getElementById('eq1-fase').innerText = fase1;
      document.getElementById('eq2-fase').innerText = fase2;
    }
  </script>
</body>
</html>
